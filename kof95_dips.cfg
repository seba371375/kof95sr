# Neo Geo MVS DIP Switches & Game Configuration
# 0 = OFF (Normal), 1 = ON (Active)

difficulty=8   # Game Difficulty: 1 (Easy) to 8 (Hardest), default 4 (Normal)
blood=1        # Blood Color: 1 = Red Blood ON, 0 = Censored/Off
duplicates=0   # Duplicate Characters in Team Edit: 1 = ON, 0 = OFF
random_select=0# Random Select (?) Slot on Grid: 1 = ON, 0 = OFF

dip1=0 # Test Mode (Enter Hardware Setting)
dip2=0 # Coin Chute 2
dip3=0 # Controller Type (Mahjong)
dip4=0 # Cabinet / Multi-Link
dip5=1 # Demo Sound / Language
dip6=0 # Screen Stop / Flip
dip7=0 # Free Play
dip8=0 # Hardware Freeze (Pause)

dips=0x10
