# KOF95 Controller, Video & Keyboard Configuration
# pad_layout:
#   0 = SNK Default   (Cross=A, Circle=B, Square=C, Triangle=D)
#   1 = Fighting Std  (Square=A, Triangle=C, Cross=B, Circle=D)
#   2 = KOF Classic   (Square=A, Cross=B, Triangle=C, R1=D)

# video_filter:
#   0 = Raw Pixel (Nearest)   1 = Bilinear (Smooth)
#   2 = CRT Scanlines (50%)    3 = CRT Scanlines (75%)
#   4 = CRT Trinitron (RGB)   5 = Scale2x (Pixel HD)
#   6 = CRT Warm (Curved)

pad_layout=1
video_filter=1
vsync=1
perf_log=0

